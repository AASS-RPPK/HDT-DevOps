services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    pull_policy: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Identity Provider
  # ---------------------------------------------------------------------------
  identity-provider:
    image: ${DOCKERHUB_ORG}/hdt-identity-provider:${TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: "8005"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/hdt_identity_provider
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-to-a-long-random-secret}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8005:8005"

  # ---------------------------------------------------------------------------
  # API Gateway
  # ---------------------------------------------------------------------------
  api-gateway:
    image: ${DOCKERHUB_ORG}/hdt-api-gateway:${TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: "8000"
      IMAGE_PROCESSING_URL: http://image-processing:8001
      AI_PREDICTION_URL: http://ai-prediction:8002
      AI_AGENT_URL: http://ai-agent:8003
      BEHAVIORAL_MONITORING_URL: http://behavioral-monitoring:8004
      IDENTITY_PROVIDER_URL: http://identity-provider:8005
      ACTIVE_LEARNING_URL: http://active-learning:8006
      PROXY_TIMEOUT: "60.0"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      - identity-provider
      - image-processing
      - ai-prediction
      - ai-agent
      - behavioral-monitoring
      - active-learning
    ports:
      - "8000:8000"

  # ---------------------------------------------------------------------------
  # Image Processing
  # ---------------------------------------------------------------------------
  image-processing:
    image: ${DOCKERHUB_ORG}/hdt-image-processing:${TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: "8001"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/hdt_image_processing
      DATA_PATH: /data/input
      CONVERTER_USERNAME: ${CONVERTER_USERNAME:-conversion_user}
      CONVERTER_PASSWORD: ${CONVERTER_PASSWORD:-change_me}
      UPLOAD_TOKENS: ${UPLOAD_TOKENS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MAX_UPLOAD_SIZE_BYTES: "5368709120"
    volumes:
      - converter_input_data:/data/input
      - converter_output_data:/data/output
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"

  # ---------------------------------------------------------------------------
  # HIPA Converter
  # ---------------------------------------------------------------------------
  hipa-converter:
    image: xprikryl/hipa-converter:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - api-gateway
      - image-processing
    environment:
      # Poll conversion jobs through API Gateway.
      API_BASE_URL: http://api-gateway:8000
      API_USERNAME: ${CONVERTER_USERNAME:-conversion_user}
      API_PASSWORD: ${CONVERTER_PASSWORD:-change_me}
      POLLING_INTERVAL_SECONDS: ${HIPA_POLLING_INTERVAL_SECONDS:-30}
    volumes:
      # Shared input/output directories with image-processing.
      - converter_input_data:/data/input
      - converter_output_data:/data/output

  # ---------------------------------------------------------------------------
  # AI Prediction (API + Celery Worker)
  # ---------------------------------------------------------------------------
  ai-prediction:
    image: ${DOCKERHUB_ORG}/hdt-ai-prediction:${TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: "8002"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/hdt_ai_prediction
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8002:8002"

  ai-prediction-worker:
    image: ${DOCKERHUB_ORG}/hdt-ai-prediction-worker:${TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/hdt_ai_prediction
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # AI Agent
  # ---------------------------------------------------------------------------
  ai-agent:
    image: ${DOCKERHUB_ORG}/hdt-ai-agent:${TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: "8003"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/hdt_ai_agent
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8003:8003"

  # ---------------------------------------------------------------------------
  # Behavioral Monitoring
  # ---------------------------------------------------------------------------
  behavioral-monitoring:
    image: ${DOCKERHUB_ORG}/hdt-behavioral-monitoring:${TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: "8004"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/hdt_behavioral_monitoring
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8004:8004"

  # ---------------------------------------------------------------------------
  # Active Learning
  # ---------------------------------------------------------------------------
  active-learning:
    image: ${DOCKERHUB_ORG}/hdt-active-learning:${TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: "8006"
    ports:
      - "8006:8006"

  # ---------------------------------------------------------------------------
  # Web Frontend
  # ---------------------------------------------------------------------------
  web-fe:
    image: ${DOCKERHUB_ORG}/hdt-web-fe:${TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: http://api-gateway:8000
    depends_on:
      - api-gateway
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  converter_input_data:
  converter_output_data:
